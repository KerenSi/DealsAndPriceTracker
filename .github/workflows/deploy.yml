name: Deploy

# Builds both images, pushes them to ECR and restarts the stack on the EC2 host
# (deploy/terraform). Skipped until the AWS_* repository variables exist.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/dealstracker-backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/dealstracker-frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Roll out on the host
        env:
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          b64() { base64 -w0 "$1"; }
          jq -n \
            --arg compose "$(b64 deploy/compose.prod.yml)" \
            --arg caddy "$(b64 deploy/Caddyfile)" \
            --arg script "$(b64 deploy/remote-deploy.sh)" \
            --arg registry "$REGISTRY" --arg tag "$IMAGE_TAG" \
            '{commands: [
              "set -eu",
              "mkdir -p /opt/dealstracker && cd /opt/dealstracker",
              "echo \($compose) | base64 -d > compose.prod.yml",
              "echo \($caddy) | base64 -d > Caddyfile",
              "echo \($script) | base64 -d > remote-deploy.sh && chmod +x remote-deploy.sh",
              "./remote-deploy.sh \($registry) \($tag)"
            ]}' > params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${IMAGE_TAG:0:7}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)

          # First deploys pull every image, so allow up to 15 minutes.
          for _ in $(seq 1 90); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          echo "Deploy status: $STATUS"
          test "$STATUS" = "Success"
