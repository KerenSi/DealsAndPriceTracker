spring:
  application:
    name: deals-tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dealstracker}
    username: ${DB_USERNAME:dealstracker}
    password: ${DB_PASSWORD:dealstracker}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

tracker:
  timezone: Asia/Jerusalem
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  admin-token: ${ADMIN_TOKEN:}
  ingestion:
    # Daily at 06:00 Israel time (MVP definition of done: daily price collection).
    cron: ${INGESTION_CRON:0 0 6 * * *}
    run-on-startup: ${INGESTION_RUN_ON_STARTUP:false}
  deals:
    default-threshold-percent: 15
    baseline-days: 30
    long-baseline-days: 60
  sources:
    sample:
      # Synthetic data so the app works end-to-end before real feeds are wired up.
      enabled: ${SAMPLE_SOURCE_ENABLED:true}
    transparency:
      # Real store prices (Price Transparency Law files). Set SAMPLE_SOURCE_ENABLED=false with it.
      enabled: ${TRANSPARENCY_SOURCE_ENABLED:false}
      feeds: []
      # Where each chain publishes its files. The logins are the public read-only accounts the
      # chains publish for these files.
      portals:
        TIV_TAAM:
          type: CERBERUS
          url: https://url.publishedprices.co.il
          username: ${TIV_TAAM_USERNAME:TivTaam}
          password: ${TIV_TAAM_PASSWORD:}
        OSHER_AD:
          type: CERBERUS
          url: https://url.publishedprices.co.il
          username: ${OSHER_AD_USERNAME:osherad}
          password: ${OSHER_AD_PASSWORD:}
        YOCHANANOF:
          type: CERBERUS
          url: ${YOCHANANOF_PORTAL_URL:https://url.publishedprices.co.il}
          username: ${YOCHANANOF_USERNAME:yohananof}
          password: ${YOCHANANOF_PASSWORD:}
        GOOD_PHARM:
          type: BINA
          url: https://goodpharm.binaprojects.com
        SHUFERSAL:
          type: WEB_INDEX
          url: https://prices.shufersal.co.il/FileObject/UpdateCategory?catID={catId}&storeId={storeCode}&page={page}
          max-pages: 3
        SUPER_PHARM:
          type: WEB_INDEX
          url: https://prices.super-pharm.co.il/?type={type}&date={date}&page={page}
          max-pages: 30
        CARREFOUR:
          type: WEB_INDEX
          # The page lists one day's files (today when date is left out).
          url: https://prices.carrefour.co.il/?date={dateCompact}
          download-url: https://prices.carrefour.co.il/{fileDate}/{name}
  notifications:
    telegram:
      bot-token: ${TELEGRAM_BOT_TOKEN:}
    web-push:
      public-key: ${VAPID_PUBLIC_KEY:}
      private-key: ${VAPID_PRIVATE_KEY:}
      subject: ${VAPID_SUBJECT:https://github.com/KerenSi/DealsAndPriceTracker}
  chat:
    # Haiku keeps each question well under a cent even with the full price table; set CHAT_MODEL to switch.
    model: ${CHAT_MODEL:claude-haiku-5-5}
    max-tokens: 16000
