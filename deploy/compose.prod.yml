# Production stack on the single EC2 host. Images come from ECR; secrets come
# from the .env file that remote-deploy.sh writes out of SSM Parameter Store.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: dealstracker
      POSTGRES_USER: dealstracker
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealstracker"]
      interval: 5s
      retries: 10
    mem_limit: 384m

  backend:
    image: ${REGISTRY}/dealstracker-backend:${IMAGE_TAG}
    restart: unless-stopped
    # Every /dealstracker/* SSM parameter (written to .env by remote-deploy.sh) reaches the
    # backend, e.g. SAMPLE_SOURCE_ENABLED or TRANSPARENCY_SOURCE_ENABLED. The values below win.
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/dealstracker
      DB_USERNAME: dealstracker
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN missing}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      CORS_ALLOWED_ORIGINS: https://${SITE_ADDRESS}
      JAVA_TOOL_OPTIONS: -Xmx448m -XX:+UseSerialGC
    # Only reachable from the host itself (admin calls via SSM session), never from the internet.
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 768m

  frontend:
    image: ${REGISTRY}/dealstracker-frontend:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
      HOSTNAME: 0.0.0.0
    mem_limit: 384m

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m

volumes:
  pgdata:
  caddy_data:
  caddy_config:
