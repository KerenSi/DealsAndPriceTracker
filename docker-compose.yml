services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dealstracker
      POSTGRES_USER: dealstracker
      POSTGRES_PASSWORD: dealstracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealstracker"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/dealstracker
      DB_USERNAME: dealstracker
      DB_PASSWORD: dealstracker
      ADMIN_TOKEN: ${ADMIN_TOKEN:-devtoken}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "3000:3000"

volumes:
  pgdata:
